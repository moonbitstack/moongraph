name: Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: toolchain
        run: |
          moon version --all
          moon update

      # The demo page runs the library itself, so the engine is built here and never committed.
      - name: build the engine
        run: |
          mkdir -p docs/engine
          moon build src/examples/browser --target js --release
          cp _build/js/release/build/examples/browser/browser.js docs/engine/moongraph.js

      - name: api reference is current
        run: |
          python3 scripts/gen_api.py
          git diff --exit-code docs/api.html

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
