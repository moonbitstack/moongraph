name: Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: toolchain
        run: |
          moon version --all
          moon update

      # The demo page runs the library itself, so the engine is built here and never committed.
      # The three names below are the contract the pages import: a build that stopped exporting
      # one of them would leave a board silently empty, so the build is asked for them first.
      - name: build the engine
        run: |
          moon build src/examples/browser --target js --release
          engine=_build/js/release/build/examples/browser/browser.js
          test -s "$engine"
          for name in graphs run run_grid; do
            grep -q " as $name" "$engine" || { echo "the engine does not export $name"; exit 1; }
          done
          mkdir -p docs/engine
          cp "$engine" docs/engine/moongraph.js
          cmp "$engine" docs/engine/moongraph.js

      - name: the pages show the code that runs
        run: |
          python3 scripts/gen_docs_snippets.py
          git diff --exit-code docs/guide.html docs/index.html

      - name: api reference is current
        run: |
          python3 scripts/gen_api.py
          git diff --exit-code docs/api.html

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
