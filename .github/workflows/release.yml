name: Release

# A version tag publishes this module to mooncakes under the moonbitstack account. Publishing is
# opt-in: the publish job runs only while the organization (or repository) variable
# MOONCAKES_PUBLISH is 'true', so a tag with the switch off only runs the tests.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: test
        run: |
          moon update
          moon check --target all
          moon test --target all

  publish:
    needs: test
    if: vars.MOONCAKES_PUBLISH == 'true'
    runs-on: ubuntu-26.04
    environment: mooncakes
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: check tag and namespace
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' moon.mod)"
          grep -q '^name = "moonbitstack/' moon.mod || { echo "::error::moon.mod is not under moonbitstack"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME##*v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match moon.mod version $version"; exit 1
          fi

      - name: publish
        env:
          CREDENTIALS: ${{ secrets.MOONCAKES_CREDENTIALS }}
        run: |
          if [ -z "$CREDENTIALS" ]; then echo "::error::MOONCAKES_CREDENTIALS is not available"; exit 1; fi
          trap 'rm -f ~/.moon/credentials.json' EXIT
          printf '%s' "$CREDENTIALS" > ~/.moon/credentials.json
          moon update
          moon publish

      # Tell the organisation site a new version exists, so the catalogue it
      # publishes stops needing an edit per release. Without the token the step
      # says so and the site's half-monthly run picks the version up instead.
      - name: tell the site
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "no SITE_DISPATCH_TOKEN — the site will catch up on its own"; exit 0; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/moonbitstack/moonbitstack.github.io/dispatches \
            -d '{"event_type":"released"}'

  # The skill in skills/moongraph is the prose an agent reads before it writes code
  # against this module: it ships with the tag so that a reader of a version gets the
  # prose of that version. The zip is attached to the release when one exists for the
  # tag, and always left on the run for a hand download.
  #
  # The marketplace half of the publication is not wired: it needs an endpoint and a
  # credential this repository does not carry yet, and until then the zip is what that
  # step will consume.
  skill:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: check the skill
        run: |
          test -f skills/moongraph/SKILL.md || { echo "::error::skills/moongraph/SKILL.md is missing"; exit 1; }
          grep -qx 'name: moongraph' skills/moongraph/SKILL.md || { echo "::error::the skill name does not match its folder"; exit 1; }
          grep -q '^description: ' skills/moongraph/SKILL.md || { echo "::error::the skill has no description"; exit 1; }

      - name: pack
        run: |
          ( cd skills && zip -qr ../moongraph-skill.zip moongraph )
          unzip -l moongraph-skill.zip

      - uses: actions/upload-artifact@v4
        with:
          name: moongraph-skill
          path: moongraph-skill.zip
          if-no-files-found: error

      - name: attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" moongraph-skill.zip --clobber
          else
            echo "no release for $GITHUB_REF_NAME yet — the zip stays on this run"
          fi
