name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            pkg="$dir/moon.pkg"
            if ! grep -q 'kind: "executable"' "$pkg"; then
              continue
            fi
            # A package that declares its targets may not have a native one. The browser
            # engine is compiled for js and wasm-gc only, so asking for native is an error
            # rather than a skip, and the step has to read the declaration first.
            if grep -q 'supported_targets' "$pkg" && ! grep -q 'supported_targets.*native' "$pkg"; then
              echo "skipping $dir: no native target"
              continue
            fi
            echo "running $dir"
            moon run "$dir" --target native > /dev/null
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

      # The code the site shows is a region of the tests that run, written into the page by a
      # script; a page whose blocks are stale would teach a reader code that no longer compiles.
      - name: the pages show the code that runs
        if: runner.os == 'Linux'
        run: python3 scripts/gen_docs_snippets.py --check

      # The vectors replay one implementation, recorded when the corpus was generated. This
      # asks a second one the same questions on the same shapes, now: where the two part
      # company the library had to choose a reading, and the choice is in the README rather
      # than in a comment nobody reads. Both are pinned, because a reference that moves turns
      # a green run into a different question.
      - name: the second reference agrees
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/references"
          "$RUNNER_TEMP/references/bin/pip" install --quiet --disable-pip-version-check \
            "networkx==3.7" "numpy==2.5.4" "rustworkx==0.18.1"
          "$RUNNER_TEMP/references/bin/python" scripts/compare_references.py

      # The site is written by hand, so nothing else notices a page that lost its header, or a
      # link to a file that was renamed.
      - name: the pages hold together
        if: runner.os == 'Linux'
        run: python3 scripts/check_docs.py
